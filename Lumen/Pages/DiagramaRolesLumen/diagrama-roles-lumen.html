<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LUMEN · Diagrama de Roles de Usuario</title>
  <style>
    :root{--bg:#050b15;--panel:#091b31;--ink:#ecf8ff;--muted:#a0bbd6;--cyan:#20dcff;--purple:#aa7aff;--orange:#ff9d25;--line:#377bad}*{box-sizing:border-box}body{margin:0;min-width:320px;background:radial-gradient(circle at 50% 35%,#153c62 0,transparent 31rem),linear-gradient(135deg,#030814,#0a1b30 45%,#050a14);color:var(--ink);font-family:Inter,system-ui,"Segoe UI",sans-serif}.shell{max-width:1500px;margin:auto;padding:25px clamp(16px,3vw,50px) 40px}.head{position:relative;text-align:center;padding:18px 18px 25px;border-bottom:1px solid #226e9e}.kicker{margin:0;color:var(--cyan);font:700 .72rem ui-monospace,monospace;letter-spacing:.18em}.head h1{margin:5px 0 0;font-size:clamp(1.8rem,4vw,3.4rem);letter-spacing:-.04em}.head h1 span{color:var(--orange)}.head p{margin:8px auto 0;max-width:58ch;color:var(--muted)}.diagram{position:relative;min-height:780px;margin-top:24px;overflow:hidden;border:1px solid #1e638f;background:linear-gradient(#08182bf0,#07111ef3);box-shadow:0 25px 70px #000b}.diagram:before{content:"";position:absolute;inset:0;opacity:.35;background:linear-gradient(#2d87ac20 1px,transparent 1px),linear-gradient(90deg,#2d87ac20 1px,transparent 1px);background-size:34px 34px;pointer-events:none}.ring{position:absolute;left:50%;top:46%;width:min(62vw,780px);aspect-ratio:1;border:1px dashed #21dfff77;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 80px #21dfff19}.ring:after{content:"";position:absolute;inset:7%;border:1px solid #a979ff55;border-radius:50%}.section-tag{position:absolute;z-index:4;padding:7px 12px;border:1px solid var(--cyan);background:#061628;color:var(--cyan);font:700 .7rem ui-monospace,monospace;letter-spacing:.12em}.internal-tag{right:28px;bottom:184px}.external-tag{right:28px;bottom:34px;border-color:var(--orange);color:var(--orange)}.links{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}.link{fill:none;stroke:#277db1;stroke-width:2;opacity:.8;filter:drop-shadow(0 0 4px #1fdfff)}.link.external{stroke:var(--orange);filter:drop-shadow(0 0 4px #ff9d25)}.link.active{stroke-width:4;opacity:1}.role,.core{position:absolute;z-index:2;cursor:pointer;text-align:left;color:var(--ink);background:linear-gradient(135deg,#12325b,#071426);border:1px solid #4ca8d1;border-radius:7px;padding:15px 15px 14px 82px;min-height:104px;width:285px;clip-path:polygon(0 13px,13px 0,calc(100% - 18px) 0,100% 18px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px));box-shadow:inset 0 0 0 1px #8bdcff21,0 12px 25px #0009;transition:.22s}.role:hover,.role.active{transform:translateY(-5px);border-color:var(--orange);box-shadow:0 0 25px #ff9d2555}.role h2{margin:0;font-size:1.05rem}.role p{margin:7px 0 0;color:#b5d5eb;font-size:.77rem;line-height:1.45}.badge{position:absolute;left:-22px;top:17px;display:grid;place-items:center;width:80px;height:80px;border:4px solid var(--cyan);border-radius:50%;background:#071b34;color:var(--orange);font-size:2rem;box-shadow:0 0 0 5px #0b2a49,0 0 18px #1ce4ff}.role.external .badge{border-color:var(--orange);color:var(--cyan)}.pm{left:calc(50% - 142px);top:42px}.lead{left:7%;top:225px}.artist{right:7%;top:225px}.qa{left:calc(50% - 142px);top:495px}.core{left:50%;top:335px;transform:translateX(-50%);display:grid;place-content:center;width:260px;height:190px;padding:28px;text-align:center;border-radius:50%;background:radial-gradient(circle,#173d69,#051121 70%);border:5px double #35dfff;clip-path:none;box-shadow:0 0 0 9px #0b2846,0 0 38px #21dcff77}.core:hover{transform:translateX(-50%) scale(1.03)}.core .mark{font-size:3rem;line-height:1;color:var(--orange);text-shadow:0 0 16px #ff9d25}.core h2{margin:7px 0 3px;font-size:1.75rem}.core p{margin:0;color:#c0daf1;font-size:.76rem;line-height:1.35}.external-row{position:absolute;z-index:3;left:7%;right:7%;bottom:27px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.external-row .role{position:relative;left:auto;top:auto;width:100%;min-height:110px}.modal{width:min(620px,calc(100vw - 28px));border:1px solid #55bde9;border-radius:12px;background:#09182aeF;color:var(--ink);box-shadow:0 30px 80px #000c}.modal::backdrop{background:#000a;backdrop-filter:blur(5px)}.modal header{display:flex;justify-content:space-between;align-items:center;padding:17px 20px;border-bottom:1px solid #295277}.modal h2{margin:0}.modal button{cursor:pointer;border:1px solid #4c87ab;border-radius:50%;width:33px;height:33px;background:#0f2a48;color:var(--ink);font-size:1.2rem}.modal section{padding:20px;color:#c1d8e9;line-height:1.55}.modal strong{color:var(--cyan)}@media(max-width:900px){.diagram{min-height:1120px}.ring{top:37%;width:720px}.lead{left:3%;top:240px}.artist{right:3%;top:240px}.qa{top:520px}.core{top:365px}.external-row{bottom:25px;grid-template-columns:1fr}.external-row .role{min-height:88px}.internal-tag{bottom:390px}.external-tag{bottom:280px}}@media(max-width:620px){.diagram{min-height:1170px}.pm{left:50%;transform:translateX(-50%);top:25px}.lead{left:50%;transform:translateX(-50%);top:155px}.artist{left:50%;right:auto;transform:translateX(-50%);top:285px}.core{top:455px}.qa{left:50%;transform:translateX(-50%);top:665px}.external-row{left:16px;right:16px;bottom:18px}.internal-tag{display:none}.external-tag{display:none}.ring{top:42%;width:620px}.role{width:285px}}
  </style>
</head>
<body>
  <main class="shell"><header class="head"><p class="kicker">DIMATREK SERVICES · EXPERIENCIA Y OPERACIÓN</p><h1>DIAGRAMA DE <span>ROLES DE USUARIO</span></h1><p>LUMEN · RPG de reparación, puzles lógicos e identidad sintética</p></header>
    <section class="diagram" id="diagram" aria-label="Diagrama interactivo de roles de Lumen">
      <div class="ring"></div><span class="section-tag internal-tag">ROLES INTERNOS / TÉCNICOS</span><span class="section-tag external-tag">USUARIOS FINALES</span><svg class="links" id="links" aria-hidden="true"></svg>
      <button class="role pm" data-role="pm"><span class="badge">◈</span><h2>Project Manager</h2><p>Backlog, sprints, riesgos y coordinación de entregables.</p></button>
      <button class="role lead" data-role="lead"><span class="badge">⌘</span><h2>Lead Programmer / Game Designer</h2><p>Unity, C#, puzles, combate y sincronización.</p></button>
      <button class="role artist" data-role="artist"><span class="badge">✦</span><h2>Artista 2D / 3D</h2><p>Low-poly, animación, textura PSX y dirección visual.</p></button>
      <button class="role qa" data-role="qa"><span class="badge">✓</span><h2>Documentador / QA</h2><p>Guías, pruebas, control de riesgos y calidad.</p></button>
      <button class="core" data-role="core"><span class="mark">◉</span><h2>LUMEN</h2><p>Juego · PWA Terminal Codex · API compartida</p></button>
      <div class="external-row"><button class="role external" data-role="player"><span class="badge">◌</span><h2>Jugador de PC</h2><p>Explora, repara, resuelve y decide el destino de M-4.</p></button><button class="role external" data-role="codex"><span class="badge">▣</span><h2>Usuario Terminal Codex</h2><p>Consulta lore, mapa, logros y progreso sincronizado.</p></button><button class="role external" data-role="community"><span class="badge">☄</span><h2>Comunidad / Playtester</h2><p>Prueba la demo y aporta feedback de jugabilidad.</p></button></div>
    </section></main>
  <dialog class="modal" id="modal"><header><h2 id="modal-title">Rol</h2><button id="close" aria-label="Cerrar">×</button></header><section id="modal-body"></section></dialog>
  <script>
    const info={pm:['Project Manager','Orquesta el plan de desarrollo: administra backlog, prioridades, riesgos y ritmo de los sprints. Mantiene la demo alineada con el alcance de ocho semanas.'],lead:['Lead Programmer / Game Designer','Convierte el GDD en sistemas: controles, reparación, puzles, combate simple y conexión con la PWA/API. Decide los límites técnicos que preservan una experiencia fluida.'],artist:['Artista 2D / 3D','Da forma a Lumen: personajes low-poly, animaciones, texturas pixeladas, UI y atmósfera retro-tecnológica. Colabora con audio para hacer reconocibles los momentos narrativos.'],qa:['Documentador / QA','Documenta decisiones, prepara casos de prueba, identifica riesgos y verifica que mecánicas, rendimiento y flujos de usuario cumplan el diseño.'],core:['Núcleo LUMEN','El producto integrado: aventura de M-4 y PIP, interfaz Terminal Codex y una API compartida para sincronizar progreso, logros y enciclopedia.'],player:['Jugador de PC','Usuario de la experiencia principal en Windows. Explora la ciudad, usa el kit de reparación, encuentra registros y se enfrenta al conflicto entre CORE y RESTORE.'],codex:['Usuario Terminal Codex','Usuario de la PWA complementaria. Consulta personajes, robots, mapa, coleccionables y el progreso que el juego sincroniza.'],community:['Comunidad / Playtester','Participa desde Itch.io, devlogs o pruebas. Sus observaciones ayudan a validar la claridad de los puzles, la atmósfera y la estabilidad antes del lanzamiento comercial.']};
    const pairs=[['pm','core'],['lead','core'],['artist','core'],['qa','core'],['core','player'],['core','codex'],['community','qa']];const canvas=document.getElementById('diagram'),svg=document.getElementById('links'),modal=document.getElementById('modal');
    function draw(){svg.innerHTML='';const r=canvas.getBoundingClientRect();pairs.forEach(([a,b])=>{const A=document.querySelector(`[data-role="${a}"]`).getBoundingClientRect(),B=document.querySelector(`[data-role="${b}"]`).getBoundingClientRect();const p=document.createElementNS('http://www.w3.org/2000/svg','path');const x1=A.left+A.width/2-r.left,y1=A.top+A.height/2-r.top,x2=B.left+B.width/2-r.left,y2=B.top+B.height/2-r.top;p.dataset.edge=`${a}-${b}`;p.classList.add('link');if(['player','codex','community'].includes(a)||['player','codex','community'].includes(b))p.classList.add('external');p.setAttribute('d',`M${x1},${y1} L${x2},${y2}`);svg.append(p)})}function select(role){document.querySelectorAll('.role,.core').forEach(x=>x.classList.toggle('active',x.dataset.role===role));document.querySelectorAll('.link').forEach(x=>x.classList.toggle('active',x.dataset.edge.split('-').includes(role)));const [t,b]=info[role];document.getElementById('modal-title').textContent=t;document.getElementById('modal-body').innerHTML=`<strong>Responsabilidad principal</strong><br>${b}`;modal.showModal()}document.querySelectorAll('[data-role]').forEach(x=>x.addEventListener('click',()=>select(x.dataset.role)));document.getElementById('close').onclick=()=>modal.close();modal.addEventListener('click',e=>{if(e.target===modal)modal.close()});addEventListener('resize',draw);draw();
  </script>
</body>
</html>
